<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chord Finder</title>
<style>
  :root{
    --bg-0:#171310;
    --bg-1:#211a15;
    --wood:#2b211a;
    --wood-line:#3a2d22;
    --brass:#c9974f;
    --brass-bright:#e8b768;
    --cream:#efe6d6;
    --cream-dim:#a8998266;
    --muted:#8a7b68;
    --string:#d8cbb4;
    --red-led:#e2543a;
    --green-led:#7fae6a;
    --error:#c9634a;
    --font-display:'Oswald', 'Arial Narrow', sans-serif;
    --font-body:'Inter', -apple-system, sans-serif;
    --font-mono:'JetBrains Mono', 'Courier New', monospace;
  }
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap');

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse at 50% -10%, #3a2a1c 0%, transparent 60%),
      linear-gradient(180deg, var(--bg-0), #14100d 100%);
    color:var(--cream);
    font-family:var(--font-body);
    min-height:100vh;
    padding:32px 18px 60px;
    display:flex;
    justify-content:center;
  }
  .rack{
    width:100%;
    max-width:560px;
  }

  /* ---- Header: pedal nameplate ---- */
  .nameplate{
    text-align:center;
    margin-bottom:22px;
  }
  .nameplate .eyebrow{
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:.28em;
    text-transform:uppercase;
    color:var(--brass);
    opacity:.85;
  }
  .nameplate h1{
    font-family:var(--font-display);
    font-weight:600;
    font-size:clamp(28px,7vw,40px);
    letter-spacing:.02em;
    margin:4px 0 0;
    color:var(--cream);
    text-shadow:0 1px 0 rgba(0,0,0,.4);
  }
  .nameplate h1 span{color:var(--brass-bright);}

  /* ---- Input jack panel ---- */
  .panel{
    background:linear-gradient(180deg, var(--wood), #241b15);
    border:1px solid var(--wood-line);
    border-radius:14px;
    padding:18px;
    box-shadow:0 18px 40px -18px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.03);
    margin-bottom:20px;
  }
  .input-row{
    display:flex;
    gap:10px;
    align-items:stretch;
  }
  .input-row input{
    flex:1;
    background:#100c09;
    border:1px solid #40332590;
    border-radius:8px;
    color:var(--cream);
    font-family:var(--font-mono);
    font-weight:700;
    font-size:22px;
    letter-spacing:.02em;
    padding:12px 14px;
    outline:none;
    min-width:0;
  }
  .input-row input::placeholder{color:var(--cream-dim);font-weight:400;}
  .input-row input:focus{border-color:var(--brass);box-shadow:0 0 0 3px #c9974f22;}
  .led{
    width:11px;height:11px;border-radius:50%;
    align-self:center;
    background:var(--muted);
    box-shadow:inset 0 1px 2px rgba(0,0,0,.5);
    flex-shrink:0;
    transition:background .15s, box-shadow .15s;
  }
  .led.on-good{background:var(--green-led);box-shadow:0 0 8px 1px #7fae6a99, inset 0 1px 2px rgba(0,0,0,.3);}
  .led.on-bad{background:var(--red-led);box-shadow:0 0 8px 1px #e2543a99, inset 0 1px 2px rgba(0,0,0,.3);}

  .chip-row{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
    margin-top:12px;
  }
  .chip{
    font-family:var(--font-mono);
    font-size:12px;
    color:var(--muted);
    background:#1b140f;
    border:1px solid #3a2d2280;
    padding:5px 10px;
    border-radius:20px;
    cursor:pointer;
    transition:color .15s, border-color .15s;
  }
  .chip:hover{color:var(--brass-bright);border-color:var(--brass);}

  /* ---- Diagram stage ---- */
  .stage{
    background:linear-gradient(180deg,#1c1610,#171210);
    border:1px solid var(--wood-line);
    border-radius:14px;
    padding:26px 18px 20px;
    text-align:center;
    min-height:380px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:14px;
  }
  .stage .empty{
    color:var(--cream-dim);
    font-family:var(--font-mono);
    font-size:14px;
    line-height:1.7;
  }
  .stage .error{
    color:var(--error);
    font-family:var(--font-mono);
    font-size:14px;
    max-width:320px;
    line-height:1.6;
  }
  .chord-title{
    font-family:var(--font-display);
    font-size:30px;
    font-weight:600;
    color:var(--brass-bright);
    letter-spacing:.01em;
  }
  .chord-sub{
    font-family:var(--font-mono);
    font-size:12px;
    color:var(--muted);
    letter-spacing:.05em;
    margin-top:-8px;
  }
  svg.diagram{
    max-width:100%;
    height:auto;
  }

  .voicing-nav{
    display:flex;
    align-items:center;
    gap:16px;
    margin-top:2px;
  }
  .voicing-nav button{
    background:#241b15;
    border:1px solid var(--wood-line);
    color:var(--cream);
    width:34px;height:34px;
    border-radius:50%;
    font-size:16px;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:border-color .15s,color .15s;
  }
  .voicing-nav button:hover:not(:disabled){border-color:var(--brass);color:var(--brass-bright);}
  .voicing-nav button:disabled{opacity:.3;cursor:default;}
  .voicing-nav .label{
    font-family:var(--font-mono);
    font-size:12px;
    color:var(--muted);
    letter-spacing:.05em;
    min-width:80px;
  }

  footer{
    text-align:center;
    margin-top:18px;
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--cream-dim);
    letter-spacing:.04em;
  }

  @media (max-width:420px){
    .chord-title{font-size:24px;}
  }
</style>
</head>
<body>
<div class="rack">

  <div class="nameplate">
    <div class="eyebrow">Standard Tuning &mdash; E A D G B e</div>
    <h1>Chord<span>Finder</span></h1>
  </div>

  <div class="panel">
    <div class="input-row">
      <input id="chordInput" type="text" autocomplete="off" autocapitalize="off" spellcheck="false"
        placeholder="Type any chord… e.g. F#m7b5" />
      <div class="led" id="led"></div>
    </div>
    <div class="chip-row" id="chipRow"></div>
  </div>

  <div class="stage" id="stage">
    <div class="empty">Start typing a chord name above.<br/>Try <b style="color:var(--brass-bright)">C</b>, <b style="color:var(--brass-bright)">Am7</b>, or <b style="color:var(--brass-bright)">Bb9</b>.</div>
  </div>

  <footer>Diagrams pulled from a standard-tuning open/barre chord library</footer>
</div>

      svg += '<rect x="'+leftPad+'" y="'+(nutY-3)+'" width="'+gridW+'" height="4" fill="#efe6d6" rx="1"/>';
    } else {
      svg += '<line x1="'+leftPad+'" y1="'+nutY+'" x2="'+(leftPad+gridW)+'" y2="'+nutY+'" stroke="#5a4a3a" stroke-width="1.5"/>';
    }

    // fret lines
    for(let f=1; f<=numFretsShown; f++){
      const y = topPad + f*fretGap;
      svg += '<line x1="'+leftPad+'" y1="'+y+'" x2="'+(leftPad+gridW)+'" y2="'+y+'" stroke="#5a4a3a" stroke-width="1"/>';
    }

    // strings
    for(let s=0; s<6; s++){
      const x = leftPad + s*stringGap;
      svg += '<line x1="'+x+'" y1="'+topPad+'" x2="'+x+'" y2="'+(topPad+gridH)+'" stroke="#c9b896" stroke-width="1.4"/>';
    }

    // barres (draw before dots so dots sit on top)
    barres.forEach(function(barreRelFret){
      const fretted = [];
      for(let s=0;s<6;s++){ if(frets[s] === barreRelFret) fretted.push(s); }
      if(fretted.length < 2) return;
      const minS = Math.min.apply(null, fretted), maxS = Math.max.apply(null, fretted);
      const y = topPad + (barreRelFret - 0.5) * fretGap;
      const x1 = leftPad + minS*stringGap, x2 = leftPad + maxS*stringGap;
      svg += '<line x1="'+x1+'" y1="'+y+'" x2="'+x2+'" y2="'+y+'" stroke="#c9974f" stroke-width="16" stroke-linecap="round" opacity="0.9"/>';
    });

    // open / mute markers above nut
    for(let s=0; s<6; s++){
      const x = leftPad + s*stringGap;
      const y = topPad - 16;
      const val = frets[s];
      if(val === -1){
        svg += '<text x="'+x+'" y="'+(y+6)+'" font-family="JetBrains Mono, monospace" font-size="14" fill="#8a7b68" text-anchor="middle">\u00d7</text>';
      } else if(val === 0){
        svg += '<circle cx="'+x+'" cy="'+y+'" r="6" fill="none" stroke="#efe6d6" stroke-width="1.6"/>';
      }
    }

    // fretted note dots
    for(let s=0; s<6; s++){
      const val = frets[s];
      if(val > 0){
        const x = leftPad + s*stringGap;
        const y = topPad + (val - 0.5) * fretGap;
        svg += '<circle cx="'+x+'" cy="'+y+'" r="10.5" fill="#e8b768" stroke="#171210" stroke-width="1"/>';
        const fin = fingers[s];
        if(fin && fin > 0){
          svg += '<text x="'+x+'" y="'+(y+4)+'" font-family="JetBrains Mono, monospace" font-weight="700" font-size="11" fill="#171210" text-anchor="middle">'+fin+'</text>';
        }
      }
    }

    // string name labels at bottom
    const names = ['E','A','D','G','B','e'];
    for(let s=0; s<6; s++){
      const x = leftPad + s*stringGap;
      svg += '<text x="'+x+'" y="'+(topPad+gridH+18)+'" font-family="JetBrains Mono, monospace" font-size="10" fill="#8a7b68" text-anchor="middle">'+names[s]+'</text>';
    }

    svg += '</svg>';
    return svg;
  }

  // ---- App wiring ----
  const input = document.getElementById('chordInput');
  const stage = document.getElementById('stage');
  const led = document.getElementById('led');
  const chipRow = document.getElementById('chipRow');

  const CHIPS = ['C','G','Am','F','Dm7','E7','Bm7b5','C#maj7','Bb9','F#m'];
  CHIPS.forEach(function(c){
    const el = document.createElement('div');
    el.className = 'chip';
    el.textContent = c;
    el.addEventListener('click', function(){ input.value = c; renderCurrent(); });
    chipRow.appendChild(el);
  });

  let currentEntry = null;
  let currentIndex = 0;
  let currentParsed = null;

  function renderCurrent(){
    const raw = input.value;
    if(!raw.trim()){
      led.className = 'led';
      stage.innerHTML = '<div class="empty">Start typing a chord name above.<br/>Try <b style="color:var(--brass-bright)">C</b>, <b style="color:var(--brass-bright)">Am7</b>, or <b style="color:var(--brass-bright)">Bb9</b>.</div>';
      currentEntry = null;
      return;
    }
    const parsed = parseChord(raw);
    if(!parsed){
      led.className = 'led on-bad';
      stage.innerHTML = '<div class="error">Can\'t read “'+raw+'” as a chord yet.<br/>Try a root A–G (optionally # or b) plus a quality, like <b>Fm7</b> or <b>C#dim</b>.</div>';
      currentEntry = null;
      return;
    }
    const entry = findChordEntry(parsed);
    if(!entry || !entry.positions || !entry.positions.length){
      led.className = 'led on-bad';
      stage.innerHTML = '<div class="error">No diagram on file for “'+raw+'”.<br/>Try a more common spelling, e.g. <b>m7</b> instead of <b>min7</b>.</div>';
      currentEntry = null;
      return;
    }
    led.className = 'led on-good';
    currentEntry = entry;
    currentParsed = parsed;
    currentIndex = 0;
    renderVoicing();
  }

  function renderVoicing(){
    if(!currentEntry) return;
    const positions = currentEntry.positions;
    const pos = positions[currentIndex];
    const svg = renderDiagram(pos);
    const bassNote = currentParsed.bass ? ' <span style="color:var(--muted)">/ '+currentParsed.bass+'</span>' : '';
    let html = '';
    html += '<div class="chord-title">'+currentParsed.label+bassNote+'</div>';
    html += '<div class="chord-sub">'+(positions.length>1 ? 'VOICING '+(currentIndex+1)+' OF '+positions.length : 'OPEN POSITION')+'</div>';
    html += svg;
    if(positions.length > 1){
      html += '<div class="voicing-nav">';
      html += '<button id="prevBtn" '+(currentIndex===0?'disabled':'')+'>\u2190</button>';
      html += '<div class="label">shape '+(currentIndex+1)+' / '+positions.length+'</div>';
      html += '<button id="nextBtn" '+(currentIndex===positions.length-1?'disabled':'')+'>\u2192</button>';
      html += '</div>';
    }
    stage.innerHTML = html;
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    if(prevBtn) prevBtn.addEventListener('click', function(){ if(currentIndex>0){ currentIndex--; renderVoicing(); } });
    if(nextBtn) nextBtn.addEventListener('click', function(){ if(currentIndex<currentEntry.positions.length-1){ currentIndex++; renderVoicing(); } });
  }

  input.addEventListener('input', renderCurrent);
  input.focus();
})();
</script>
</body>
</html>
